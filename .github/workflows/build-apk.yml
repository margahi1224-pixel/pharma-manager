name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Generates android/, ios/, etc. platform folders if this is the
      # first run and they aren't committed to the repo yet. Safe to
      # re-run — it won't overwrite an existing platform folder.
      # --project-name is forced to pharma_manager because the repo
      # folder name (pharma-manager, with a hyphen) is not a valid
      # Dart package name.
      - name: Ensure platform folders exist
        run: flutter create --platforms=android --project-name pharma_manager .

      # isar_flutter_libs ships a Kotlin stdlib newer than the default
      # Kotlin Gradle plugin version flutter create ships with, causing
      # "compiled with incompatible version of Kotlin" errors. Bump it
      # regardless of which gradle file format this Flutter version used.
      - name: Bump Kotlin version
        run: |
          if [ -f android/build.gradle ] && grep -q "kotlin_version" android/build.gradle; then
            sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.24'/" android/build.gradle
          fi
          if [ -f android/settings.gradle ] && grep -q "org.jetbrains.kotlin.android" android/settings.gradle; then
            sed -i "s/id \"org.jetbrains.kotlin.android\" version \".*\"/id \"org.jetbrains.kotlin.android\" version \"1.9.24\"/" android/settings.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      # Generates the Isar *.g.dart files from lib/models/*.dart
      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pharma-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
