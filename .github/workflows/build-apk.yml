name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Generates android/, ios/, etc. platform folders if this is the
      # first run and they aren't committed to the repo yet. Safe to
      # re-run — it won't overwrite an existing platform folder.
      # --project-name is forced to pharma_manager because the repo
      # folder name (pharma-manager, with a hyphen) is not a valid
      # Dart package name.
      - name: Ensure platform folders exist
        run: flutter create --platforms=android --project-name pharma_manager .

      # isar_flutter_libs ships Kotlin stdlib metadata newer than the
      # default Kotlin Gradle plugin version flutter create ships with.
      # This matches Groovy (id "..." version "...", ext.kotlin_version)
      # and Kotlin-DSL (id("...") version "...") formats, single or
      # double quotes, in whichever gradle file flutter generated.
      - name: Bump Kotlin version
        run: |
          NEW_KOTLIN=2.1.0
          for f in android/settings.gradle android/settings.gradle.kts android/build.gradle android/build.gradle.kts; do
            if [ -f "$f" ]; then
              echo "--- Before: $f ---"
              grep -n -i "kotlin" "$f" || true
              sed -i -E "s/(id[[:space:]]*\(?[\"']org\.jetbrains\.kotlin\.android[\"']\)?[[:space:]]*version[[:space:]]*[\"'])[^\"']*([\"'])/\1${NEW_KOTLIN}\2/" "$f"
              sed -i -E "s/(ext\.kotlin_version[[:space:]]*=[[:space:]]*[\"'])[^\"']*([\"'])/\1${NEW_KOTLIN}\2/" "$f"
              echo "--- After: $f ---"
              grep -n -i "kotlin" "$f" || true
            fi
          done

      - name: Install dependencies
        run: flutter pub get

      # Generates the Isar *.g.dart files from lib/models/*.dart
      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pharma-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
