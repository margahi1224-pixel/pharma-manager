name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Generates android/, ios/, etc. platform folders if this is the
      # first run and they aren't committed to the repo yet. Safe to
      # re-run — it won't overwrite an existing platform folder.
      - name: Ensure platform folders exist
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      # Generates the Isar *.g.dart files from lib/models/*.dart
      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pharma-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
