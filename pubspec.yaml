name: pharma_manager
description: "Cross-platform Pharmacy Management System"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Local fast database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Navigation
  go_router: ^14.2.0

  # QR / Barcode
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # UI / Utils
  intl: ^0.19.0
  fl_chart: ^0.68.0
  csv: ^6.0.0
  share_plus: ^9.0.0
  fuzzy: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/
